name: Monitor Brutal Assault hotels

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a test notification"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check-hotels:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Check hotel listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_THREAD_ID: ${{ secrets.DISCORD_THREAD_ID }}
          DISCORD_THREAD_NAME: ${{ secrets.DISCORD_THREAD_NAME }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: python monitor.py

      - name: Save monitor state
        run: |
          git config user.name "BA Hotel Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add state.json

          if ! git diff --cached --quiet; then
            git commit -m "Update hotel monitor state"
            git push
          fi
