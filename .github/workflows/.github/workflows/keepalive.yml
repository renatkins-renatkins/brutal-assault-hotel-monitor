name: Keep hotel monitor active

on:
  schedule:
    # A small monthly repository update prevents GitHub from disabling
    # scheduled workflows after 60 days of inactivity in a public repo.
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Update keepalive marker
        run: |
          date -u +"Last keepalive: %Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "BA Hotel Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add .keepalive
          git commit -m "Keep scheduled monitor active"
          git push
